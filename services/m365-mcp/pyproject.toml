[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-mcp"
version = "0.1.0"
description = "A minimal read-only Microsoft 365 MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.29,<2",
    "msal>=1.34,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
