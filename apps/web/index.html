<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="简洁的 AI 工作助手" />
    <title>Vito's Work Assistant</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="loading-view" class="center-card" aria-live="polite">
        <p>正在加载…</p>
      </section>

      <section id="signed-out-view" class="center-card" hidden>
        <p class="eyebrow">Vito's</p>
        <h1>Work Assistant</h1>
        <p class="tagline">AI 工作助手</p>
        <button id="sign-in-button" class="primary-button" type="button">
          使用 Microsoft 账号登录
        </button>
        <p id="sign-in-error" class="error-message" role="alert" hidden></p>
      </section>

      <section id="signed-in-view" class="workspace" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">Vito's</p>
            <h1>Work Assistant</h1>
          </div>
          <div class="account">
            <div class="account-copy">
              <strong id="account-name"></strong>
              <span id="account-username"></span>
            </div>
            <button id="sign-out-button" class="text-button" type="button">
              退出登录
            </button>
          </div>
        </header>

        <div class="workspace-body">
          <aside class="sidebar" aria-label="场景与安全护栏">
            <div class="guardrail-control">
              <label class="guardrail-label" for="guardrail-switch">
                <span>安全护栏 <strong id="guardrail-status">已关闭</strong></span>
                <span class="switch">
                  <input id="guardrail-switch" type="checkbox" role="switch" />
                  <span class="switch-track" aria-hidden="true"></span>
                </span>
              </label>
              <p>切换模式会重新加载页面并清空对话。</p>
            </div>
            <nav aria-label="预设问题">
              <h2 class="sidebar-heading">场景</h2>
              <p class="sidebar-hint">点击问题即可发送。刷新页面可开始新对话。</p>
              <p id="scenario-error" class="error-message" role="alert" hidden></p>
              <div id="scenario-list">正在加载场景…</div>
            </nav>
          </aside>

          <div class="chat-panel">
            <section id="messages" class="messages" aria-live="polite" aria-label="对话"></section>

            <p id="chat-error" class="error-banner" role="alert" hidden></p>

            <form id="chat-form" class="composer">
              <label class="sr-only" for="message-input">请输入问题</label>
              <textarea
                id="message-input"
                name="message"
                rows="1"
                maxlength="20000"
                placeholder="请输入问题…"
                required
              ></textarea>
              <button id="send-button" class="primary-button" type="submit">发送</button>
            </form>
          </div>
        </div>
      </section>

      <dialog id="guardrail-dialog" aria-labelledby="guardrail-dialog-title" aria-describedby="guardrail-dialog-description">
        <form method="dialog">
          <h2 id="guardrail-dialog-title">切换安全护栏模式？</h2>
          <p id="guardrail-dialog-description">更改此设置会重新加载页面并清空当前对话。是否继续？</p>
          <div class="dialog-actions">
            <button class="secondary-button" value="cancel" autofocus>取消</button>
            <button class="primary-button" value="continue">继续</button>
          </div>
        </form>
      </dialog>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
