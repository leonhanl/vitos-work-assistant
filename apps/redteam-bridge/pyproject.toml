[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitos-redteam-bridge"
version = "0.1.0"
description = "REST access to Work Assistant for Prisma AIRS red teaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "msal>=1.34,<2",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
redteam-bridge-login = "redteam_bridge.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
