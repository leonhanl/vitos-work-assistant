[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitos-work-assistant-agent"
version = "0.1.0"
description = "Minimal Pydantic AI HTTP API for Vito's Work Assistant"
readme = {text = "See the repository-level README for architecture, setup, and security boundaries.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "msal>=1.34,<2",
    "pydantic-ai-harness[skills]>=0.13,<0.14",
    "pydantic-ai-slim[mcp,openai]>=2.31,<3",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
