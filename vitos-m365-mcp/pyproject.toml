[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitos-m365-mcp"
version = "0.2.0"
description = "A read-only Microsoft 365 Streamable HTTP MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.29,<2",
    "msal>=1.34,<2",
    "pydantic-settings>=2.10,<3",
    "PyJWT[crypto]>=2.10,<3",
    "python-docx>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vitos-m365-mcp = "m365_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
