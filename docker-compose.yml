name: vitos-work-assistant

# 前置步骤：cp env.template .env 并填写所有值

services:

  m365-mcp-http:
    build:
      context: services/m365-mcp-http
    env_file: .env
    ports:
      - "8001:8001"

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - m365-mcp-http

  web:
    build:
      context: apps/web
      args:
        - VITE_ENTRA_TENANT_ID
        - VITE_ENTRA_CLIENT_ID
        - VITE_WORK_ASSISTANT_API_CLIENT_ID
        - VITE_WORK_ASSISTANT_API_SCOPE
    ports:
      - "5173:80"
    depends_on:
      - agent
